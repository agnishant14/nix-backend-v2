# This is a basic workflow to help you get started with Actions
name: Deploy on push

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Prevents parallel deployment collisions on rapid pushes
concurrency:
  group: deploy-nix-backend-${{ github.ref }}
  cancel-in-progress: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: home-server

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Ensure target directory exists
      - name: Ensure target directory exists
        run: |
          mkdir -p /home/dvishal485/TeamPortal/nix-backend

      # Copy source code to target dir with permission fixes and exclusions
      - name: Copy source code to target dir
        run: |
          rsync -avz --no-group --no-owner --chmod=D755,F644 --exclude 'uploads/' --exclude 'node_modules/' $GITHUB_WORKSPACE/ /home/dvishal485/TeamPortal/nix-backend/

      # Install exact dependencies cleanly from package-lock.json
      - name: Install dependencies
        run: |
          cd /home/dvishal485/TeamPortal/nix-backend
          npm ci

      # Reload the Root PM2 process zero-downtime
      - name: Deploy to web
        run: |
          sudo pm2 reload nix-shell-env || sudo pm2 restart nix-shell-env
